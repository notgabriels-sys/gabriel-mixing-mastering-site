<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Not found — Gabriel Garcia Alonso</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="public/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/css/styles.css?v=20260824e" />
</head>
<body>
  <!--
    Netlify, Vercel, Cloudflare Pages and GitHub Pages all serve /404.html
    automatically for unknown paths. No configuration needed.

    Unlike every other page here, this one uses paths absolute from the site
    root (/assets/…). A 404 is served for arbitrary URLs — /a/b/c/typo — and
    relative paths would resolve against that phantom directory and 404 the
    stylesheet too. The trade-off is that this single page won't style
    correctly when opened straight off the filesystem, or if the site is ever
    hosted in a subdirectory rather than at a domain root.
  -->
  <div class="status">
    <h1>Not found</h1>
    <p>
      That page doesn't exist — most likely a mistyped or outdated link.
      Everything for sale lives on one page.
    </p>
    <a class="btn btn--primary" href="index.html#services">Back to services</a>
  </div>
</body>
</html>
